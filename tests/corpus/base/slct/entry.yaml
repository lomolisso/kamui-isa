id: slct
kernel: k_slct
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 11, low: -100000, high: 100000}}
  - {name: b, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 98, low: -100000, high: 100000}}
  - {name: c, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 99, low: -3, high: 3}}
  - {name: d0, kind: output, dtype: s32, count: 256}
  - {name: d1, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['slct\.s32\.s32', 'slct\.s32\.f32']
deterministic: true
tolerance_class: exact
notes: 'Selector values include -0.0 and 0.'
