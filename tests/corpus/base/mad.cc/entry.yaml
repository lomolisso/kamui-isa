id: mad.cc
kernel: k_mad_cc
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 13, low: 0, high: 4294967295}}
  - {name: b, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 75, low: 0, high: 4294967295}}
  - {name: c, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 76, low: 0, high: 4294967295}}
  - {name: c2, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 77, low: 0, high: 4294967295}}
  - {name: dlo, kind: output, dtype: u32, count: 256}
  - {name: dhi, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['mad\.lo\.cc\.u32', 'madc\.hi\.u32']
deterministic: true
tolerance_class: exact
