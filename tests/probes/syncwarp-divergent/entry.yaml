id: syncwarp-divergent
kernel: p_syncwarp_div
compile:
  extra_flags: []
launch:
  grid: [1, 1, 1]
  block: [32, 1, 1]
  cluster: null
  dynamic_smem: 0
params:
  - {name: got, kind: output, dtype: u32, count: 32}
  - {name: mask, kind: output, dtype: u32, count: 32}
  - {name: sink, kind: inout, dtype: u32, count: 32, generator: {kind: const, value: 0}}
expect_ptx: ['bar\.warp\.sync\s+-1;[\s\S]*bar\.warp\.sync\s+-1;']
deterministic: false
tolerance_class: property:probe
