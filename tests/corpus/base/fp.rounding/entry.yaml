id: fp.rounding
kernel: k_fp_rounding
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 154, low: -1000.0, high: 1000.0}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 155, low: -0.001, high: 0.001}}
  - {name: c, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 156, low: -1000.0, high: 1000.0}}
  - {name: d, kind: output, dtype: f32, count: 3328}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['add\.rz\.f32', 'add\.rm\.f32', 'add\.rp\.f32', 'fma\.rz\.f32', 'cvt\.rp\.f32\.f64']
deterministic: true
tolerance_class: exact
notes: 'Small second operands make the four modes give different results.'
