id: trap
kernel: k_trap
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 387, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
  - {name: at, kind: scalar, dtype: s32, value: 200}
expect_ptx: ['trap;']
deterministic: true
tolerance_class: property:launch_fails
notes: 'Thread 200 traps: the launch reports an error and the outputs are not checked.'
