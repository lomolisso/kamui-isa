id: bmsk
kernel: k_bmsk
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 501, low: 0, high: 4294967295}}
  - {name: b, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 552, low: 0, high: 40}}
  - {name: d0, kind: output, dtype: u32, count: 256}
  - {name: d1, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['bmsk\.clamp\.b32', 'bmsk\.wrap\.b32']
deterministic: true
tolerance_class: exact
