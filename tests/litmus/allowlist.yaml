  reason: *d51_self_copy

- kind: h100
  test: ptx/kamui/features/mbarrier/MP+mbarrier.arrive_drop.cta+remote
  model: plain
  reason: &d47_remote_arrive >-
    The contract takes the stronger reading of D47 (2026-11-11): the waits and updates of one mbarrier object are
    morally strong whatever their scopes, so a remote arrive synchronizes with a .cta wait. The H100 does not give
    this ordering (it does not give it even within one CTA at .cta scope, see mbarrier_cta above); Kamui's contract
    is stronger than the H100 here, and a Kamui implementation built like the H100 must add the ordering (K11).

