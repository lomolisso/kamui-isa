name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_TYPES: feat|fix|docs|test|refactor|perf|build|ci|chore|revert

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull request title is a conventional commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re="^(${CC_TYPES})(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$"
          if [[ ! "$TITLE" =~ $re ]] || [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title must be 'type(scope): subject', at most 72 characters: $TITLE"
            exit 1
          fi

      - name: Commit subjects are conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          re="^(${CC_TYPES})(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$"
          bad=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $re ]] || [ "${#subject}" -gt 72 ]; then
              echo "::error::not a conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit "$bad"

      - name: Changelog updated for user-visible changes
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$TITLE" =~ ^(feat|fix)(\(|!|:) ]] || [[ "$TITLE" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            if ! git diff --name-only "$BASE...$HEAD" | grep -qx CHANGELOG.md; then
              echo "::error::feat, fix and breaking changes must add a line to CHANGELOG.md"
              exit 1
            fi
          fi

      - name: No em-dash characters
        run: |
          if git grep -nP '\x{2014}' -- . ':(exclude)deps'; then
            echo "::error::replace the em-dash characters above"
            exit 1
          fi

      - name: Shell scripts pass shellcheck
        run: shellcheck tools/*.sh tools/tests/*.sh tools/catalog/*.sh tools/proofs/*.sh proofs/rocq/als/*.sh proofs/rocq/extract/*.sh jobs/*.sh .devcontainer/*.sh .devcontainer/bin/*

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tool tests
        run: tools/tests/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install pyyaml==6.0.2 pytest==8.3.3 numpy==2.1.3

      - name: Python unit tests
        run: python -m pytest -q tools/

      - name: PTX catalog coverage checks
        run: python tools/catalog/check_coverage.py --all --require-entries

      - name: PTX table is up to date
        run: python tools/catalog/gen_table.py --check

      - name: PTX corpus entries match their committed PTX
        run: python tools/corpus/build.py --all --lint

      - name: Probe entries match their PTX
        run: python tools/corpus/build.py tests/probes/*/ --lint

      - name: SASS evidence covers every feature
        run: python tools/evidence/sass.py --check

      - name: Goldens are current for every corpus entry
        run: python tools/evidence/check_goldens.py

      - name: Litmus suite and verdicts are consistent
        run: python tools/litmus/check_suite.py

      - name: Generated litmus files are current
        run: |
          python tools/litmus/gen_families.py --check
          python tools/litmus/gen_features.py --check
          python tools/litmus/to_alloy.py --check
          python tools/litmus/to_alloy87.py --check
          python tools/litmus/to_kamui.py --check
          python tools/litmus/to_riscv.py --check
          python tools/litmus/to_cuda.py --check

      - name: H100 litmus evidence is current
        run: python tools/litmus/observed.py

      - name: Feature scorecard and mutants are current
        run: |
          python tools/litmus/scorecard.py --check
          python tools/litmus/mutate.py --check
          python tools/litmus/mutate.py --report-check
          python proofs/rocq/extract/to_rocq.py --check

      # The Rocq proof of the PTX 8.7 to Kamui lowering (proofs/rocq), in the official Rocq image (the versions of
      # the dev image's Rocq switch). The built relation library (deps/hahn) is cached between runs.
      - name: Relation library for the Rocq proof
        run: git submodule update --init --depth 1 deps/hahn

      - name: Cache the built relation library
        uses: actions/cache@v4
        with:
          path: build/rocq/hahn
          key: rocq-9.2.0-hahn-${{ hashFiles('deps/hahn/*.v', 'deps/hahn/_CoqProject') }}

      - name: Rocq proof builds and passes its checks (with the stored sample of mutated executions)
        env:
          ROCQ_IMAGE: rocq/rocq-prover:9.2.0@sha256:33926fb3757b2b560c3844157bd64173a26b6d338a256be1ae5eec8df2019025
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PATH=/home/rocq/.opam/4.14.2+flambda/bin:/usr/local/bin:/usr/bin:/bin \
            --entrypoint bash -v "$PWD:/w" -w /w "$ROCQ_IMAGE" \
            -c 'time make -C proofs/rocq JOBS=4 checker && tools/proofs/check.sh &&
                proofs/rocq/extract/diff.sh --check proofs/rocq/extract/mutants.txt.gz'
