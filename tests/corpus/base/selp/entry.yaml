id: selp
kernel: k_selp
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 11, low: -100000, high: 100000}}
  - {name: b, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 97, low: -100000, high: 100000}}
  - {name: c, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 13, low: 0, high: 4294967295}}
  - {name: d32, kind: output, dtype: s32, count: 256}
  - {name: d64, kind: output, dtype: s64, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['selp\.b(32|64)']
deterministic: true
tolerance_class: exact
