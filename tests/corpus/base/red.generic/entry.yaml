id: red.generic
kernel: k_red_generic
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: val, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 358, low: 0, high: 65535}}
  - {name: acc, kind: inout, dtype: u32, count: 5, generator: {kind: const, value: 0}}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['red\.add\.u32', 'red\.max\.u32']
deterministic: true
tolerance_class: exact
