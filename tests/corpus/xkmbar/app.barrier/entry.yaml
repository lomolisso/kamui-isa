id: app.barrier
kernel: k_app_barrier
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 3, low: -1000, high: 1000}}
  - {name: out, kind: output, dtype: s32, count: 256}
expect_ptx: ['(bar|barrier)\.sync\s+0', 'st\.shared', 'ld\.shared']
deterministic: true
tolerance_class: exact
