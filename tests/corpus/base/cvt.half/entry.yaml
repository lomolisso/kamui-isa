id: cvt.half
kernel: k_cvt_half
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: f, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 104, low: -60000.0, high: 60000.0}}
  - {name: dh, kind: output, dtype: f16, count: 256}
  - {name: df, kind: output, dtype: f32, count: 256}
  - {name: di, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['cvt\.rn\.f16\.f32', 'cvt\.f32\.f16', 'cvt\.rzi\.s32\.f16']
deterministic: true
tolerance_class: exact
