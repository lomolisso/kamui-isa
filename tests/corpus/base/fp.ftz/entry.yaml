id: fp.ftz
kernel: k_fp_ftz
compile: {extra_flags: [-ffp-contract=off, -fcuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 157, low: -2.0e-38, high: 2.0e-38}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 158, low: -2.0e-38, high: 2.0e-38}}
  - {name: d_add, kind: output, dtype: f32, count: 256}
  - {name: d_mul, kind: output, dtype: f32, count: 256}
  - {name: d_fma, kind: output, dtype: f32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['add\.rn\.ftz\.f32', 'mul\.rn\.ftz\.f32', 'fma\.rn\.ftz\.f32']
deterministic: true
tolerance_class: ftz
notes: 'Inputs are near the subnormal range (below 1.18e-38).'
