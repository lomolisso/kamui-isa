id: atom.vector
kernel: k_atom_vector
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: acc, kind: inout, dtype: f32, count: 8, generator: {kind: const, value: 0.0}}
  - {name: racc, kind: inout, dtype: f32, count: 4, generator: {kind: const, value: 0.0}}
  - {name: old, kind: output, dtype: f32, count: 512}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['atom\.global\.v2\.f32\.add', 'red\.global\.v4\.f32\.add']
deterministic: false
tolerance_class: property:atomic
notes: 'All values are multiples of 0.25, so the final sums are exact.'
