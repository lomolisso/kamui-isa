id: mul.fp
kernel: k_mul_fp
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 115, low: -1000.0, high: 1000.0}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 116, low: -1000.0, high: 1000.0}}
  - {name: d, kind: output, dtype: f32, count: 256}
  - {name: a64, kind: input, dtype: f64, count: 256, generator: {kind: random, seed: 215, low: -1000.0, high: 1000.0}}
  - {name: b64, kind: input, dtype: f64, count: 256, generator: {kind: random, seed: 216, low: -1000.0, high: 1000.0}}
  - {name: d64, kind: output, dtype: f64, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['mul\.rn\.f32', 'mul\.rn\.f64']
deterministic: true
tolerance_class: exact
