id: cvt.bf16
kernel: k_cvt_bf16
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: f, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 562, low: -1000000.0, high: 1000000.0}}
  - {name: d, kind: output, dtype: u16, count: 256}
  - {name: d2, kind: output, dtype: u16, count: 256}
  - {name: df, kind: output, dtype: f32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['cvt\.rn\.bf16\.f32', 'cvt\.rn\.relu\.bf16\.f32']
deterministic: true
tolerance_class: exact
