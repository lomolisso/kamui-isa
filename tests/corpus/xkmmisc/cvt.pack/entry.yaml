id: cvt.pack
kernel: k_cvt_pack
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 553, low: -100000, high: 100000}}
  - {name: b, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 554, low: -100000, high: 100000}}
  - {name: c, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 501, low: 0, high: 4294967295}}
  - {name: d0, kind: output, dtype: u32, count: 256}
  - {name: d1, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['cvt\.pack\.sat\.u16\.s32', 'cvt\.pack\.sat\.s8\.s32\.b32']
deterministic: true
tolerance_class: exact
