id: half.packed
kernel: k_half_packed
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 186, low: 0, high: 2080340991}}
  - {name: b, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 187, low: 0, high: 2080340991}}
  - {name: c, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 188, low: 0, high: 2080340991}}
  - {name: dadd, kind: output, dtype: u32, count: 256}
  - {name: dsub, kind: output, dtype: u32, count: 256}
  - {name: dmul, kind: output, dtype: u32, count: 256}
  - {name: dfma, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['add\.rn\.f16x2', 'sub\.rn\.f16x2', 'mul\.rn\.f16x2', 'fma\.rn\.f16x2']
deterministic: true
tolerance_class: exact
notes: 'Buffers hold pairs of f16 as u32 words, low half first.'
