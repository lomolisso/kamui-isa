id: stacksave
kernel: k_stacksave
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 389, low: 0, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['stacksave\.u64', 'alloca\.u64', 'stackrestore\.u64']
deterministic: true
tolerance_class: exact
notes: 'alloca returns a local-memory address; cvta.local turns it into a generic pointer.'
