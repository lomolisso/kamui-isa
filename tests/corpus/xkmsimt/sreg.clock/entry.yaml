id: sreg.clock
kernel: k_sreg_clock
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 391, low: 0, high: 1000}}
  - {name: d32, kind: output, dtype: u32, count: 256}
  - {name: d64, kind: output, dtype: u64, count: 256}
  - {name: dg, kind: output, dtype: u64, count: 256}
  - {name: dhi, kind: output, dtype: u32, count: 256}
  - {name: dx, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['%clock;', '%clock64', '%globaltimer', '%clock_hi']
deterministic: false
tolerance_class: property:monotonic
notes: 'Differences are non-negative; dx is exact.'
