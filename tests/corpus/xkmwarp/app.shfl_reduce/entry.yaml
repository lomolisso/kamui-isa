id: app.shfl_reduce
kernel: k_app_shfl_reduce
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 2, low: -1000, high: 1000}}
  - {name: out, kind: output, dtype: s32, count: 8}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['shfl\.sync\.bfly\.b32']
deterministic: true
tolerance_class: exact
