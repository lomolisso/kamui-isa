id: atom.half
kernel: k_atom_half
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: acch, kind: inout, dtype: u16, count: 1, generator: {kind: const, value: 0}}
  - {name: acch2, kind: inout, dtype: u32, count: 1, generator: {kind: const, value: 0}}
  - {name: accb, kind: inout, dtype: u16, count: 1, generator: {kind: const, value: 0}}
  - {name: accb2, kind: inout, dtype: u32, count: 1, generator: {kind: const, value: 0}}
  - {name: old, kind: output, dtype: u32, count: 1024}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['atom\.global\.add\.noftz\.f16\s', 'atom\.global\.add\.noftz\.f16x2', 'atom\.global\.add\.noftz\.bf16\s', 'atom\.global\.add\.noftz\.bf16x2']
deterministic: false
tolerance_class: property:atomic
notes: 'Every thread adds 1.0 (f16), 0.5 pairs (f16x2), 1.0 (bf16), 0.5 pairs (bf16x2); 256 is exact in all formats.'
