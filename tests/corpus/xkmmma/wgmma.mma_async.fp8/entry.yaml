id: wgmma.mma_async.fp8
kernel: k_wgmma_mma_async_fp8
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [1, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u32, count: 512, generator: {kind: random, seed: 672, low: 0, high: 926365495}}
  - {name: b, kind: input, dtype: u32, count: 128, generator: {kind: random, seed: 672, low: 0, high: 926365495}}
  - {name: d, kind: output, dtype: f32, count: 512}
expect_ptx: ['wgmma\.mma_async\.sync\.aligned\.m64n8k32\.f32\.e4m3\.e4m3', 'wgmma\.fence\.sync\.aligned', 'wgmma\.commit_group\.sync\.aligned', 'wgmma\.wait_group\.sync\.aligned 0']
deterministic: true
tolerance_class: reduction
notes: 'One warpgroup (128 threads); A and B come from shared memory through descriptors (no swizzle).'
