id: bfind
kernel: k_bfind
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a32, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 13, low: 0, high: 4294967295}}
  - {name: du, kind: output, dtype: s32, count: 256}
  - {name: ds, kind: output, dtype: s32, count: 256}
  - {name: dsh, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['bfind\.u32', 'bfind\.s32', 'bfind\.shiftamt\.u32']
deterministic: true
tolerance_class: exact
notes: 'A zero input returns 0xffffffff.'
