# How the PTX 8.7 model treats each memory-related feature of the catalog (tests/corpus/catalog.yaml): every
# in-scope feature of the state spaces (5.1), data movement (9.7.9), synchronization (9.7.13), ldmatrix and
# stmatrix, and wgmma (9.7.15). kind: modelled (the model has events for it; `tests` names litmus tests under
# tests/litmus/ptx/), no-effect (it creates no memory event), outside (the model does not apply). D<n>: the
# interpretation decisions in decisions.md. tools/litmus/check_suite.py checks that no feature is missing.
