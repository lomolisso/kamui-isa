id: copysign
kernel: k_copysign
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 152, low: -1000.0, high: 1000.0}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 153, low: -1000.0, high: 1000.0}}
  - {name: d, kind: output, dtype: f32, count: 256}
  - {name: a64, kind: input, dtype: f64, count: 256, generator: {kind: random, seed: 252, low: -1000.0, high: 1000.0}}
  - {name: b64, kind: input, dtype: f64, count: 256, generator: {kind: random, seed: 253, low: -1000.0, high: 1000.0}}
  - {name: d64, kind: output, dtype: f64, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['copysign\.f32', 'copysign\.f64']
deterministic: true
tolerance_class: exact
notes: 'clang 20 emits copysign.f32 for copysignf but bit operations for copysign on f64; f64 uses inline asm.'
