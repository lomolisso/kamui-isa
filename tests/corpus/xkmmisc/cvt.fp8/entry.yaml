id: cvt.fp8
kernel: k_cvt_fp8
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 602, low: -500.0, high: 500.0}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 603, low: -500.0, high: 500.0}}
  - {name: d8, kind: output, dtype: u16, count: 512}
  - {name: dh, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['cvt\.rn\.satfinite\.e4m3x2\.f32', 'cvt\.rn\.satfinite\.relu\.e5m2x2\.f32', 'cvt\.rn\.f16x2\.e4m3x2']
deterministic: true
tolerance_class: exact
