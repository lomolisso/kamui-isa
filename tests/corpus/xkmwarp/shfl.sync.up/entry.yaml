id: shfl.sync.up
kernel: k_shfl_sync_up
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: v, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 363, low: -100000, high: 100000}}
  - {name: src, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 301, low: 0, high: 4294967295}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: d8, kind: output, dtype: s32, count: 256}
  - {name: df, kind: output, dtype: f32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['shfl\.sync\.up\.b32']
deterministic: true
tolerance_class: exact
