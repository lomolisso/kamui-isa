id: set
kernel: k_set
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 95, low: -8, high: 8}}
  - {name: b, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 96, low: -8, high: 8}}
  - {name: d0, kind: output, dtype: u32, count: 256}
  - {name: d1, kind: output, dtype: u32, count: 256}
  - {name: d2, kind: output, dtype: f32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['set\.lt\.u32\.s32', 'set\.ge\.and\.u32\.s32', 'set\.gtu\.f32\.f32']
deterministic: true
tolerance_class: exact
