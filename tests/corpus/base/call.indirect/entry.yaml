id: call.indirect
kernel: k_call_indirect
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 385, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['prototype_\d+ : \.callprototype', '^\s*call \(retval0\),\s*$']
deterministic: true
tolerance_class: exact
