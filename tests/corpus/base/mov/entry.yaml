id: mov
kernel: k_mov
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 13, low: 0, high: 4294967295}}
  - {name: d32, kind: output, dtype: u32, count: 256}
  - {name: d64, kind: output, dtype: u64, count: 256}
  - {name: df, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['mov\.b32', 'mov\.b64', 'mov\.f32', 'mov\.pred']
deterministic: true
tolerance_class: exact
