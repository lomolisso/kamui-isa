id: min.half
kernel: k_min_half
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u16, count: 256, generator: {kind: random, seed: 569, low: 0, high: 31743}}
  - {name: b, kind: input, dtype: u16, count: 256, generator: {kind: random, seed: 570, low: 0, high: 31743}}
  - {name: d, kind: output, dtype: u16, count: 1024}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['min\.f16', 'max\.f16', 'min\.NaN\.f16', 'max\.NaN\.f16']
deterministic: true
tolerance_class: exact
notes: 'Every eighth lane passes a NaN as the first operand.'
