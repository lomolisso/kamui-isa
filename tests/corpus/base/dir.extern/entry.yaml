id: dir.extern
kernel: k_dir_extern
compile: {extra_flags: [-fgpu-rdc], ptxas_flags: [-c]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 398, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['\.extern \.global']
deterministic: true
tolerance_class: exact
run: false
notes: 'Compile-only (ptxas -c): the variable is defined in another module.'
