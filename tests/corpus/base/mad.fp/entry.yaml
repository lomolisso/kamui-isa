id: mad.fp
kernel: k_mad_fp
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 127, low: -1000.0, high: 1000.0}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 128, low: -1000.0, high: 1000.0}}
  - {name: c, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 129, low: -1000.0, high: 1000.0}}
  - {name: d, kind: output, dtype: f32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['mad\.rn\.f32']
deterministic: true
tolerance_class: exact
