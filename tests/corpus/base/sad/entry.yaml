id: sad
kernel: k_sad
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 11, low: -100000, high: 100000}}
  - {name: b, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 45, low: -100000, high: 100000}}
  - {name: c, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 46, low: 0, high: 1000}}
  - {name: d, kind: output, dtype: u32, count: 256}
  - {name: du, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['sad\.s32', 'sad\.u32']
deterministic: true
tolerance_class: exact
