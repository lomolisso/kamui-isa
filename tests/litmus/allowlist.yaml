# ---- H100 observations of outcomes that the stronger readings of 2026-11-11 forbid

- kind: h100
  test: ptx/kamui/features/async/self-copy+fence+wait
  model: plain
  reason: &d51_self_copy >-
    The contract takes the stronger reading of D51 (2026-11-11): a cp.async.bulk from .shared::cta into the issuing
    CTA's own shared memory is an ordinary copy. The manual says the destination "has to be" another CTA
    (19067-19068) without stating the consequence, and the H100 does not behave as an ordinary copy here; Kamui's
    contract is stronger than the H100, which the Kamui hardware design must cover.

- kind: h100
  test: ptx/kamui/features/async/self-copy+fence+wait
  model: shuffle
  reason: *d51_self_copy

- kind: h100
  test: ptx/kamui/features/async/self-copy+fence+wait
  model: spread
  reason: *d51_self_copy

- kind: h100
