id: barrier.sync
kernel: k_barrier_sync
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 549, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
expect_ptx: ['barrier\.sync\s+0;']
deterministic: true
tolerance_class: exact
notes: 'Needs independent thread scheduling: the two halves of each warp arrive separately.'
