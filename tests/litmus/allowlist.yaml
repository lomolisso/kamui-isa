# ---- the PTX 8.7 Alloy model (models/ptx87): differences with Dartagnan, and programs with no execution

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum1-pass
  model: "*"
  reason: &quorum >-
    Three threads use a barrier with a thread count of 2, so one of them can never complete its barrier
    (9.7.13.1: the barrier completes when 2 threads arrived and is reinitialized; the third waits for a partner
    that never comes). The ptx-v8.7-alloy model counts only executions in which every thread finishes, so the
    test has no outcome (decision D9 in models/ptx87/decisions.md). Dartagnan (ptx-v7.5, ptx-v6.0, ptx-v8.7) also counts
    executions in which a thread stays blocked, with the blocked thread's later loads keeping their initial
    register values, which makes the condition reachable.

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum2-pass
  model: "*"
  reason: *quorum

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum3-pass
  model: "*"
  reason: *quorum

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum4-pass
  model: "*"
  reason: *quorum

- kind: models
  test: ptx/kamui/hand/CoWR+3writes+surface
  model: "*"
  reason: >-
    The models agree on every execution; they read the final-value condition `x == 3` differently. Coherence
    order is partial (8.9.6): the weak surface write of 3 need not be ordered after P0's write of 1. The
    ptx-v8.7-alloy query reads `x == 3` as "the write of 3 follows every other write to x", so P0's write is
    before it and P1's surface read cannot read 1. Dartagnan (ptx-v7.5) reads it as "no write follows the write
    of 3", which also holds when the two writes are unordered; then the read may read 1. With that reading the
    ptx-v8.7-alloy model allows the outcome too (models/ptx87/equiv/README.md).

- kind: no-execution
  test: ptx/imported/dat3m/Barrier/quorum1-hang
  model: ptx-v8.7-alloy
  reason: &quorum_noexec >-
    A barrier with a thread count that the test's threads cannot fill (or, for -hang, can never reach): some
    thread waits forever, so the program has no execution that finishes and no outcome (D9).

- kind: no-execution
  test: ptx/imported/dat3m/Barrier/quorum2-hang
  model: ptx-v8.7-alloy
  reason: *quorum_noexec

