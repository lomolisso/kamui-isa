id: red.global
kernel: k_red_global
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: val, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 355, low: 0, high: 65535}}
  - {name: acc, kind: inout, dtype: u32, count: 8, generator: {kind: random, seed: 356, low: 0, high: 65535}}
  - {name: accf, kind: inout, dtype: f32, count: 1, generator: {kind: const, value: 0.0}}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['red\.global\.add\.u32', 'red\.global\.inc\.u32', 'red\.global\.add\.f32']
deterministic: true
tolerance_class: reduction
notes: 'Integer results are exact; the f32 sum depends on the order.'
