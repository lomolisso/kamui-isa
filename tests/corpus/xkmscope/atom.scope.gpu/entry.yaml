id: atom.scope.gpu
kernel: k_atom_scope_gpu
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: val, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 354, low: 0, high: 65535}}
  - {name: acc, kind: inout, dtype: u32, count: 1, generator: {kind: const, value: 0}}
  - {name: old, kind: output, dtype: u32, count: 256}
  - {name: acc2, kind: inout, dtype: u32, count: 1, generator: {kind: const, value: 0}}
  - {name: old2, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['atom\.global\.add\.u32', 'atom\.relaxed\.gpu\.global\.add\.u32']
deterministic: false
tolerance_class: property:atomic
