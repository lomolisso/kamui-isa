id: mapa
kernel: k_mapa
compile: {extra_flags: []}
launch: {grid: [4, 1, 1], block: [128, 1, 1], cluster: [2, 1, 1], dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 512, generator: {kind: random, seed: 611, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 512}
  - {name: dr, kind: output, dtype: u32, count: 512}
expect_ptx: ['mapa\.u64', 'getctarank\.u64', 'barrier\.cluster\.arrive(\.aligned)?;', 'barrier\.cluster\.arrive\.relaxed', 'barrier\.cluster\.wait']
deterministic: true
tolerance_class: exact
notes: 'The last cluster barrier keeps each CTA''s shared memory alive until its peer has read it.'
