id: ld.generic
kernel: k_ld_generic
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 319, low: -1000, high: 1000}}
  - {name: tmp, kind: output, dtype: s32, count: 256}
  - {name: d, kind: output, dtype: s32, count: 256}
expect_ptx: ['^\s*ld\.u32|^\s*ld\.b32|^\s*ld\.s32', '^\s*st\.u32|^\s*st\.b32']
deterministic: true
tolerance_class: exact
notes: 'Odd lanes use shared memory, even lanes global memory, through the same generic pointer code.'
