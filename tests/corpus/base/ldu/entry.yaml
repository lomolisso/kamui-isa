id: ldu
kernel: k_ldu
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: s32, count: 2, generator: {kind: random, seed: 324, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['ldu\.global']
deterministic: true
tolerance_class: exact
