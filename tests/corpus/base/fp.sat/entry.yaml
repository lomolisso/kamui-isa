id: fp.sat
kernel: k_fp_sat
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 159, low: -2.0, high: 2.0}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 160, low: -2.0, high: 2.0}}
  - {name: d0, kind: output, dtype: f32, count: 256}
  - {name: d1, kind: output, dtype: f32, count: 256}
  - {name: d2, kind: output, dtype: f32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['add\.sat\.f32', 'mul\.sat\.f32', 'cvt\.sat\.f32\.f32']
deterministic: true
tolerance_class: exact
