id: szext
kernel: k_szext
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 501, low: 0, high: 4294967295}}
  - {name: b, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 551, low: 0, high: 40}}
  - {name: d0, kind: output, dtype: s32, count: 256}
  - {name: d1, kind: output, dtype: s32, count: 256}
  - {name: d2, kind: output, dtype: u32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['szext\.clamp\.s32', 'szext\.wrap\.s32', 'szext\.clamp\.u32']
deterministic: true
tolerance_class: exact
