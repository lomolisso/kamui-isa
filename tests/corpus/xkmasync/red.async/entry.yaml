id: red.async
kernel: k_red_async
compile: {extra_flags: []}
launch: {grid: [4, 1, 1], block: [128, 1, 1], cluster: [2, 1, 1], dynamic_smem: 0}
params:
  - {name: v, kind: input, dtype: u32, count: 512, generator: {kind: random, seed: 625, low: 0, high: 65535}}
  - {name: d, kind: output, dtype: u32, count: 512}
expect_ptx: ['red\.async\.relaxed\.cluster\.shared::cluster\.mbarrier::complete_tx::bytes\.add\.u32', 'mbarrier\.arrive\.release\.cluster\.shared::cluster\.b64']
deterministic: true
tolerance_class: exact
notes: 'Each mbarrier waits for its own expect_tx arrive and the peer''s remote arrive (count 2).'
