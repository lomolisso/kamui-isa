id: prmt
kernel: k_prmt
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 13, low: 0, high: 4294967295}}
  - {name: b, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 88, low: 0, high: 4294967295}}
  - {name: sel, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 89, low: 0, high: 65535}}
  - {name: d, kind: output, dtype: u32, count: 256}
  - {name: dm, kind: output, dtype: u32, count: 1536}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['prmt\.b32\s', 'prmt\.b32\.f4e', 'prmt\.b32\.rc16']
deterministic: true
tolerance_class: exact
