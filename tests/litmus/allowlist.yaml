    that returns True does not order the thread's later loads, here after the complete-tx of a bulk copy
    (TMA-load+*), the asynchronous arrive of cp.async.mbarrier.arrive, or several arrivals (MP2+*). The variant of
    each test with one fence.acq_rel.cta after the wait (+fence-acq) shows the outcome in 0 of about 3 million
    instances, and the copy sources are fenced to the async proxy before the test starts, so the harness is not
    the cause. PTX ISA 8.7 section 9.7.13.15.16 forbids the outcome; the model follows the manual.

