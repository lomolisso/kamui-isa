id: fma.fp
kernel: k_fma_fp
compile: {extra_flags: [-ffp-contract=off, -fno-cuda-flush-denormals-to-zero]}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 121, low: -1000.0, high: 1000.0}}
  - {name: b, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 122, low: -1000.0, high: 1000.0}}
  - {name: c, kind: input, dtype: f32, count: 256, generator: {kind: random, seed: 123, low: -1000.0, high: 1000.0}}
  - {name: d, kind: output, dtype: f32, count: 256}
  - {name: a64, kind: input, dtype: f64, count: 256, generator: {kind: random, seed: 124, low: -1000.0, high: 1000.0}}
  - {name: b64, kind: input, dtype: f64, count: 256, generator: {kind: random, seed: 125, low: -1000.0, high: 1000.0}}
  - {name: c64, kind: input, dtype: f64, count: 256, generator: {kind: random, seed: 126, low: -1000.0, high: 1000.0}}
  - {name: d64, kind: output, dtype: f64, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['fma\.rn\.f32', 'fma\.rn\.f64']
deterministic: true
tolerance_class: exact
