id: atom.shared.add
kernel: k_atom_shared_add
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: val, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 351, low: 0, high: 65535}}
  - {name: init, kind: input, dtype: u32, count: 10, generator: {kind: random, seed: 352, low: 0, high: 65535}}
  - {name: old, kind: output, dtype: u32, count: 256}
  - {name: fin, kind: output, dtype: u32, count: 20}
expect_ptx: ['atom\.shared\.add\.u32', 'atom\.shared\.min\.u32', 'atom(\.shared)?\.inc\.u32', 'atom\.shared\.cas\.b32']
deterministic: false
tolerance_class: property:atomic
notes: 'Final values of add, min, max, and, or, xor, inc, dec are exact; exch and cas depend on the order.'
