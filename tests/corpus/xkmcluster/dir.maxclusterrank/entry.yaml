id: dir.maxclusterrank
kernel: k_dir_maxclusterrank
compile: {extra_flags: []}
launch: {grid: [4, 1, 1], block: [128, 1, 1], cluster: [2, 1, 1], dynamic_smem: 0}
params:
  - {name: d, kind: output, dtype: u32, count: 512}
expect_ptx: ['\.maxclusterrank 4']
deterministic: true
tolerance_class: exact
notes: 'A launch with clusters larger than 4 CTAs must fail.'
