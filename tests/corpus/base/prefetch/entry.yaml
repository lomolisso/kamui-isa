id: prefetch
kernel: k_prefetch
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 325, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['prefetch\.global\.L1', 'prefetch\.global\.L2', 'prefetch\.L1']
deterministic: true
tolerance_class: exact
