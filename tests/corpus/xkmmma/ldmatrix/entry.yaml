id: ldmatrix
kernel: k_ldmatrix
compile: {extra_flags: []}
launch: {grid: [1, 1, 1], block: [64, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: u16, count: 512, generator: {kind: iota}}
  - {name: d, kind: output, dtype: u32, count: 512}
expect_ptx: ['ldmatrix\.sync\.aligned\.m8n8\.x4\.shared\.b16', 'ldmatrix\.sync\.aligned\.m8n8\.x4\.trans']
deterministic: true
tolerance_class: exact
