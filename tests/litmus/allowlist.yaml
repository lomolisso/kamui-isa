- kind: models
  test: ptx/kamui/hand/LB-self+surface
  model: "*"
  reason: >-
    The contract takes the stronger reading of D49 (2026-11-11): a generic read is ordered before a later write of
    the same address in any proxy. NVIDIA's mixed-proxy model (ptx-v7.5) needs a proxy fence between a generic read
    and a surface write, so it allows the load to return the later store's value.

- kind: models
  test: ptx/kamui/hand/LB-self+alias+fence.sc
  model: "*"
  reason: >-
    The contract takes the stronger reading of D48 (2026-11-11): operations on aliases of one location can be
    morally strong. Then the second fence.sc would synchronize with the first through the aliased load, against
    program order, which the Fence-SC axiom forbids. Dartagnan's ptx-v7.5 model requires the same virtual address
    for morally strong (its ms3 uses vloc), so nothing synchronizes and the load may return the later store's
    value.

- kind: models
  test: ptx/kamui/hand/CoRW-self+alias+surface
  model: "*"
  reason: >-
    Two readings of SC per location (8.10.5) since aliases can be morally strong (D48). The manual first limits the
    axiom to "any set of overlapping memory operations that are pairwise morally strong", then states it as "a
    concatenation of program order between overlapping operations and morally strong relations in communication
    order cannot result in a cycle". The contract takes the second, stronger reading, as NVIDIA's formal model does
    (acyclic strong com + po_loc): ptx-v8.7-alloy and the Dartagnan fork (ptx-v8.7, since 2026-11-12) forbid the
    cycle through the generic and the surface accesses. Dartagnan's ptx-v7.5 never makes aliases morally strong and
    allows it.
