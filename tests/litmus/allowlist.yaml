# ---- the PTX 8.7 Alloy model (models/ptx87): differences with Dartagnan, and programs with no execution

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum1-pass
  model: "*"
  reason: &quorum >-
    Three threads use a barrier with a thread count of 2, so one of them can never complete its barrier
    (9.7.13.1: the barrier completes when 2 threads arrived and is reinitialized; the third waits for a partner
    that never comes). The ptx-v8.7-alloy model counts only executions in which every thread finishes, so the
    test has no outcome (decision D9 in models/ptx87/decisions.md). Dartagnan (ptx-v7.5, ptx-v6.0) also counts
    executions in which a thread stays blocked, with the blocked thread's later loads keeping their initial
    register values, which makes the condition reachable.

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum2-pass
  model: "*"
  reason: *quorum

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum3-pass
  model: "*"
  reason: *quorum

- kind: models
  test: ptx/imported/dat3m/Barrier/quorum4-pass
  model: "*"
  reason: *quorum

