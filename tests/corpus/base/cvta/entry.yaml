id: cvta
kernel: k_cvta
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 327, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 256}
  - {name: doff, kind: output, dtype: u32, count: 256}
expect_ptx: ['cvta\.to\.shared', 'cvta\.shared\.u64', 'cvta\.to\.global']
deterministic: true
tolerance_class: exact
notes: 'cvta.to.global comes from clang; clang 20 computes __cvta_generic_to_shared without cvta, so the shared forms use inline asm.'
