id: sreg.dynamic_smem_size
kernel: k_sreg_dynamic_smem_size
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 1024}
params:
  - {name: d, kind: output, dtype: u32, count: 512}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['%dynamic_smem_size', '%total_smem_size']
deterministic: false
tolerance_class: property:range
notes: 'dynamic_smem_size is 1024; total_smem_size includes the static, dynamic and reserved parts.'
