id: clz
kernel: k_clz
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: a32, kind: input, dtype: u32, count: 256, generator: {kind: random, seed: 13, low: 0, high: 4294967295}}
  - {name: d32, kind: output, dtype: s32, count: 256}
  - {name: a64, kind: input, dtype: u64, count: 256, generator: {kind: random, seed: 56, low: 0, high: 18446744073709551615}}
  - {name: d64, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['clz\.b32', 'clz\.b64']
deterministic: true
tolerance_class: exact
notes: 'Shifted inputs include zero, for which clz returns the width.'
