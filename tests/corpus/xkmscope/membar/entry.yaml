id: membar
kernel: k_membar
compile: {extra_flags: []}
launch: {grid: [2, 1, 1], block: [128, 1, 1], cluster: null, dynamic_smem: 0}
params:
  - {name: val, kind: input, dtype: s32, count: 256, generator: {kind: random, seed: 375, low: -1000, high: 1000}}
  - {name: data, kind: output, dtype: s32, count: 256}
  - {name: flag, kind: output, dtype: s32, count: 256}
  - {name: n, kind: scalar, dtype: s32, value: 256}
expect_ptx: ['membar\.cta|fence\.acq_rel\.cta|fence\.sc\.cta', 'membar\.gl|fence\.\w+\.gpu', 'membar\.sys|fence\.\w+\.sys']
deterministic: true
tolerance_class: exact
notes: 'Single-thread results are exact; ordering itself is checked by the litmus suite.'
