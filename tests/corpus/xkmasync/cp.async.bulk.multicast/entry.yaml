id: cp.async.bulk.multicast
kernel: k_cp_async_bulk_multicast
compile: {extra_flags: []}
launch: {grid: [4, 1, 1], block: [128, 1, 1], cluster: [2, 1, 1], dynamic_smem: 0}
params:
  - {name: in, kind: input, dtype: s32, count: 1024, generator: {kind: random, seed: 636, low: -1000, high: 1000}}
  - {name: d, kind: output, dtype: s32, count: 2048}
expect_ptx: ['cp\.async\.bulk\.shared::cluster\.global\.mbarrier::complete_tx::bytes\.multicast::cluster']
deterministic: true
tolerance_class: exact
notes: 'Both CTAs of a cluster receive the same 512 words.'
